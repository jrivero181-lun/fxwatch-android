name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Quality, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK 17 launches Gradle and runs detekt. The Gradle daemon itself uses the
      # JDK 25 toolchain declared in gradle/gradle-daemon-jvm.properties (auto-provisioned).
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Static analysis and unit tests
        run: ./gradlew ktlintCheck detekt testDebugUnitTest

      - name: Android lint and debug build
        run: ./gradlew lintDebug assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

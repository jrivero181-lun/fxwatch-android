# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Only list rules whose defaults clash with Jetpack Compose conventions.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  LongMethod:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    # Enum constructor args (e.g. HistoryPeriod.WEEK(7)) are already named by the entry.
    ignoreEnums: true
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
